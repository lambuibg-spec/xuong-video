      <span style="width:8px"></span>${nutL('loai', '', 'Mọi loại')}${nutL('loai', 'ND', 'Video dựng ND')}${nutL('loai', 'OS', 'One short')}</span>
    <button class="nut" data-cddong="1" style="margin-left:auto">✕ Đóng</button>`;

      baoSC(r.ok ? '✅ ĐÃ CHỐT ' + k.replace('|', ' · ') + ' — ' + (r.tt || '') : '⛔ ' + (r.tt || 'lỗi'), r.ok);

const MAU = {'MAI ÁO ĐỎ': 'var(--ad)', 'MAI THI DAILY': 'var(--mt)'};

let GOC = '', QUET_LUC = null, DS = [], KENH = '', TT = '', CT = {}, NGAY = null, DOI = null;     // NGAY: null = tự lấy ngày mới nhất, '' = tất cả ngày; DOI: đối chiếu sổ theo ngày
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const kenhTag = k => `<span class="kenh"><i style="background:${MAU[k] || '#888'}"></i>${esc(TEN_K[k] || k)}</span>`;

async function tai() {
  let tt;
  try {                                                                     // 02/11: lỗi hay thiếu thư mục thì báo rõ, không để kẹt ở "Đang đọc thư mục…"
    [DS, tt] = await Promise.all([fetch('/api/tat_ca').then(r => r.json()), fetch('/api/tinh_trang').then(r => r.json())]);
  } catch (e) { return baoLoi(`Không đọc được dữ liệu: ${esc(e.message)}. Kiểm tool còn chạy không rồi tải lại trang.`); }
  GOC = tt.goc; QUET_LUC = tt.quet_luc;
  if (!Array.isArray(DS)) return baoLoi(`Tool báo lỗi khi đọc thư mục: ${esc(DS.loi || '')}`);
  if (!tt.co_goc) return baoLoi(`Máy này chưa có thư mục video:<br><b>${esc(tt.goc)}</b><br>Chép video về đúng chỗ đó, hoặc tạo junction / đặt biến <b>TIKTOK_FILE_LAM</b>. Video không nằm trên git.`);
  if (!DS.length) return baoLoi(`Thư mục <b>${esc(tt.goc)}</b> chưa có sản phẩm nào.`);
  dem(tt);
  veDs();
  taiDoi();

async function canhQuet() {                                                 // bản đang xem là bản cũ: đợi lượt quét nền xong rồi tự cập nhật danh sách
  const tt = await fetch('/api/tinh_trang').then(r => r.json()).catch(() => null);
  if (!tt) return;
  dem(tt);
  if (tt.quet_luc !== QUET_LUC && !tt.dang_quet) {
    DS = await fetch('/api/tat_ca').then(r => r.json());
    QUET_LUC = tt.quet_luc;
    if (Array.isArray(DS)) { dem(tt); veDs(); }
    return;
  }
  setTimeout(canhQuet, 4000);
}

// 02/11 đại ca: mặc định hiện ngày mới nhất, có mục chọn ngày; mọi kênh hiện tổng sản phẩm đã làm, từng kênh hiện tổng video đã làm
const khoaNgay = n => { const a = n.split('-').map(Number).reverse(); return a[0] * 10000 + a[1] * 100 + (a[2] || 0); };

  const nds = [...new Set(DS.flatMap(x => mucSp(x).filter(m => m.ngay && khop(m, k)).map(m => m.ngay)))], co = new Set(nds.map(ngayGon));
  for (const d of DOI?.ngay || []) if (d.so[k] && !co.has(d.ngay)) nds.push(d.ngay.split('-').map(v => v.padStart(2, '0')).join('-'));
  return nds.sort((a, b) => khoaNgay(b) - khoaNgay(a));
};
const demVideo = (k, n) => { const vs = DS.flatMap(x => videoLoc(x, k, n)); return {tong: vs.length, xong: vs.filter(v => v.nhom === 'dung_xong').length, check: vs.filter(v => v.nhom === 'dai_ca_check').length, sp: DS.filter(x => coSp(x, k, n)).length}; };
const chiTietV = d => `${d.xong} dựng xong · ${d.check} chờ check${d.tong - d.xong - d.check ? ` · ${d.tong - d.xong - d.check} khác` : ''}`;

  // 1. cảnh đã cắt — 29/10 đại ca (SP733 quay 23-10 + 24-10): "cảnh đã cắt cập nhật vào đây hết đi, bảng này phải phân loại và cập nhật hết cảnh đã cắt"
  // ⇒ MỘT bảng mỗi kênh: gộp mọi ngày vào đúng ô lượt · cảnh của phiếu (mỗi file ghi ngày), cảnh ngoài phiếu / không số lượt hiện ở cuối bảng

  for (const [kn, ds] of Object.entries(theoKenh)) {
    ds.sort((a, b) => a.p.ngay.localeCompare(b.p.ngay));

    const luoi = (goc.r.luoi || []).map(l => ({luot: l.luot, ten: l.ten, canh: l.canh.map(c => ({canh: c.canh, tich: false, files: []}))}));
    const o = {}; luoi.forEach(l => l.canh.forEach(c => { o[`${l.luot}|${c.canh}`] = c; }));
    const ngoai = {}, khac = [];
    for (const {p, r} of ds) {
      (r.luoi || []).forEach(l => l.canh.forEach(c => {
        const d = o[`${l.luot}|${c.canh}`];

        else c.files.forEach(f => (ngoai[`${l.luot}|${c.canh}`] ||= []).push({...f, ngay: p.ngay}));
      }));

        kNgoai.map(k => { const [l, c] = k.split('|'); return `<div class="canh"><div class="n"><b>L${l} C${c}</b><span>${esc(ngoai[k][0].co || '')}</span></div><div class="fs">${ngoai[k].map(f => nutF(f, f.ngay)).join('')}</div></div>`; }).join('') + '</div></div>';
    }

      `<button class="vid" data-p="${esc(f.path)}"><img loading="lazy" src="${anh(f.path)}" alt=""><div class="c">${esc(f.ngay)} · ${esc(f.ten)}</div></button>`).join('')}</div></div>`;

      `<button class="vid" data-p="${esc(p)}"><img loading="lazy" src="${anh(p)}" alt=""><div class="c">${esc(tenFile(p))}</div></button>`).join('')}</div></div></div>`;

  el.innerHTML = h;

    <dt>Thư mục</dt><dd>${esc(p.replace(GOC + '\\', '').split('\\').slice(0, -1).join(' \\ '))}</dd></dl>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="nut chinh" data-mo="${esc(p)}">📁 Mở thư mục chứa file</button>
    ${ct.goc ? `<button class="nut" data-goc="${esc(ct.goc)}" data-t="${ct.tu_s || 0}">▶ Xem gốc từ mốc</button>` : ''}</div>
    ${ct.moc_ghi ? `<div class="ghi">Mốc cắt: ${esc(ct.moc_ghi)}</div>` : ''}
    ${/ - VIDEO DỰNG XONG\\[^\\]+\.mp4$/i.test(p) ? `<div class="duyet" data-duyet="${esc(p)}"><h4>DUYỆT VIDEO NÀY</h4>
      <div class="cho-sua" id="cho-sua" style="display:none"></div>
      <div class="hang"><button class="nut dat" data-dat>✅ ĐẠT — đổi tên XONG</button></div>
      <textarea id="ghi-sua" placeholder="Ghi chú sửa (vd: vào sớm 2 s, sai mã, ảnh che mặt…) — bấm LÀM LẠI là Claude nhận việc sửa"></textarea>
      <div class="hang"><button class="nut lai" data-lai>🔁 LÀM LẠI + gửi Claude sửa</button></div>
      <div class="hang"><button class="nut xemct" data-bw>📝 CONTENT bám win</button></div>
      <div class="kq" id="duyet-kq"></div><div class="claude" id="duyet-claude"></div></div>` : ''}`;
  $('#nen-xem').classList.add('mo');
  $('#tt').dataset.xemP = p;                                                   // KHÔNG đặt data-p: bấm trong khung sẽ khớp [data-p] ⇒ xem() lại ⇒ video tự phát lại
  napGocCua(p);
  if (/\\SỬA LẠI [^\\]+$/i.test(p)) napChoSua(p);
}

// 07/11/2026 đại ca: "bấm LÀM LẠI + GHI CHÚ rồi mà ở đây ko hiện dòng gì ? Bấm rồi nó phải hiện CHỜ SỬA LẠI"
function veChoSua(luc, ghi) {
  const o = $('#cho-sua'); if (!o) return;
  o.innerHTML = `<b>⏳ CHỜ SỬA LẠI</b>${luc ? ` <span class="luc">· bấm lúc ${esc(luc)}</span>` : ''}`
    + `<div class="gc">Ghi chú đã gửi Claude: ${ghi ? esc(ghi) : '<i>(không ghi chú — Claude tự soi video tìm lỗi)</i>'}</div>`;
  o.style.display = '';
}
async function napChoSua(p) {
  veChoSua('', '…');                                    // tên SỬA LẠI là đủ biết đang chờ sửa — hiện ngay, ghi chú nạp sau
  try {
    const rs = await fetch('/api/lam_lai_tt?p=' + encodeURIComponent(p));
    let r;
    if (rs.ok) r = await rs.json();
    else {                                              // server chưa nạp bản mới ⇒ đọc thẳng sổ _LAM_LAI.json
      const ten = tenFile(p), bo = t => (t || '').replace(/^(CHỜ DUYỆT|XONG|SỬA LẠI) /, '');
      const s = await (await fetch('/file?p=' + encodeURIComponent(GOC + '\\_LAM_VIEC\\_LAM_LAI.json'))).json();
      const x = [...s].reverse().find(x => x.moi === ten || bo(x.moi) === bo(ten)) || {};
      r = {cho_sua: true, luc: x.luc || '', ghi_chu: x.ghi_chu || ''};
    }
    if (r.cho_sua) { veChoSua(r.luc, r.ghi_chu); theoClaude(); }
  } catch (e) {}
}

// 06/11/2026 đại ca: "phần tích ĐẠT, DUYỆT ở đây, bấm duyệt là auto đổi tên XONG trên fodel. Có phần LÀM LẠI và phần ghi chú sửa … claude sẽ nhận việc và sửa"
async function duyet(hanhDong) {
  const hop = document.querySelector('[data-duyet]'); if (!hop) return;
  const p = hop.dataset.duyet, kq = $('#duyet-kq'), ghi = ($('#ghi-sua')?.value || '').trim();
  if (hanhDong === 'lam_lai' && !ghi && !confirm('Chưa ghi chú sửa — Claude sẽ tự soi video tìm lỗi rồi làm lại. Gửi?')) return;
  kq.className = 'kq'; kq.textContent = '… đang làm';
  // 07/11/2026: video đang phát giữ file ⇒ Windows không cho đổi tên ⇒ nhả video trước khi đổi tên
  const v = $('#vid'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); await new Promise(r => setTimeout(r, 600)); }
  try {
    const rs = await fetch('/api/duyet', {method: 'POST', headers: {'X-Tu-Lam': '1'}, body: JSON.stringify({hanh_dong: hanhDong, p, ghi_chu: ghi})});
    const r = await rs.json().catch(() => ({ok: false, tt: 'server lỗi ' + rs.status}));
    kq.className = 'kq ' + (r.ok ? 'ok' : 'loi'); kq.textContent = r.tt || ('lỗi không rõ (mã ' + rs.status + ')');
    if (!r.ok && v) v.src = '/file?p=' + encodeURIComponent(p);
    if (r.ok && r.p) { hop.dataset.duyet = r.p; $('#tt .ten') && ($('#tt .ten').textContent = tenFile(r.p)); $('#vid').src = '/file?p=' + encodeURIComponent(r.p); }
    if (r.ok && hanhDong === 'lam_lai') {
      const n = new Date(), h = x => String(x).padStart(2, '0');
      veChoSua(`${h(n.getHours())}:${h(n.getMinutes())} ${h(n.getDate())}/${h(n.getMonth() + 1)}/${n.getFullYear()}`, ghi);
      if ($('#ghi-sua')) $('#ghi-sua').value = '';
      theoClaude();
    }
    if (r.ok) setTimeout(() => fetch('/api/lam_moi', {method: 'POST'}).then(tai), 800);
    if (r.ok) napSoCD(true);
    if (r.ok && hanhDong === 'dat') {                                        // 13/11 đại ca: ĐẠT xong tự hiện video tiếp theo
      const i = XEM.ds.indexOf(p);
      if (i >= 0) { XEM.ds.splice(i, 1); XEM.i = Math.min(i, XEM.ds.length - 1); }
      if (XEM.ds.length && XEM.i >= 0) { kq.textContent = (r.tt || 'ĐẠT') + ' · mở video tiếp theo…'; setTimeout(() => xem(XEM.ds[XEM.i]), 700); }
      else { kq.textContent = (r.tt || 'ĐẠT') + ' · đã hết video trong danh sách'; XEM.ds = []; XEM.i = -1; veDkXem(); setTimeout(dongXem, 1500); }
    }
  } catch (e) { kq.className = 'kq loi'; kq.textContent = 'lỗi: ' + e; }
}
let _tc = null;
function theoClaude() {
  clearInterval(_tc);
  const ve = async () => {
    const o = $('#duyet-claude'); if (!o) return clearInterval(_tc);
    try {
      const s = await (await fetch('/api/claude_chat?phong=sua-video')).json();
      // 09/11/2026: tin của ĐÚNG video đang mở (tên video / mã clip / SP + ND), không lấy tin cuối của cả phòng
      const hop = document.querySelector('[data-duyet]'), ten = hop ? tenFile(hop.dataset.duyet) : '';
      const bo = t => (t || '').replace(/^(CHỜ DUYỆT|XONG|SỬA LẠI|TRÙNG ĐÃ ĐĂNG) /, '');
      const mc = ten.match(/ - OS\d+ \d{19} - (.+?)\.mp4$/i), mn = ten.match(/ SP(\d+) .* - (ND\d+)/);
      const cua = x => (x.video && bo(x.video) === bo(ten)) || (mc && (x.chu || '').includes(mc[1])) || (mn && new RegExp('SP' + mn[1] + '\\b[^\\n]{0,40}' + mn[2]).test(x.chu || ''));
      const tin = (s.tin || s.ds || []).filter(x => x.nguoi === 'Claude' && cua(x)).slice(-1)[0];
      o.textContent = (s.dang ? '⏳ Claude đang sửa: ' + (s.viec || '') + '\n' : '') + (tin && tin.nguoi === 'Claude' ? '💬 Claude: ' + tin.chu : '');
      if (!s.dang) clearInterval(_tc);
    } catch (e) {}
  };
  ve(); _tc = setInterval(ve, 4000);
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-bw]')) { const h = document.querySelector('[data-duyet]'); if (h) moBW(h.dataset.duyet); return; }
  if (e.target.id === 'nen-bw' || e.target.id === 'bw-dong') return dongBW();
  if (e.target.closest('[data-dat]')) duyet('dat');
  else if (e.target.closest('[data-lai]')) duyet('lam_lai');
});
function dongXem() { $('#nen-xem').classList.remove('mo'); $('#vid').pause(); nhaGoc(); if (CD.mo) napSoCD(true); }

document.addEventListener('click', e => {
  if (e.target.id === 'nen-xem') return dongXem();
  if (e.target.closest('[data-quay]')) return veLai();
  if (e.target.closest('#nen-sc')) return;                                    // 13/11: khung chờ sếp chốt tự xử lý bấm (trước: nút xem gốc mở thêm khung xem ⇒ 2 tiếng)
  const t = e.target.closest('[data-sp],[data-mo],[data-p],[data-goc],[data-chon]');
  if (!t) return;
  if (t.dataset.chon) { NGAY = t.dataset.chon; return veDs(); }
  if (t.dataset.sp) moSp(+t.dataset.sp);
  else if (t.dataset.mo) moTM(t.dataset.mo);
  else if (t.dataset.p) { datDsXem(t); xem(t.dataset.p); }
  else if (t.dataset.goc) { const v = $('#vid'); v.src = '/file?p=' + encodeURIComponent(t.dataset.goc) + '#t=' + t.dataset.t; v.play().catch(() => {}); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#nen-bw').classList.contains('mo')) return dongBW(); dongXem(); }
  if ($('#nen-xem').classList.contains('mo') && !/^(TEXTAREA|INPUT)$/.test(document.activeElement?.tagName || '') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); sangXem(e.key === 'ArrowRight' ? 1 : -1); }
});
document.addEventListener('click', e => { if (e.target.closest('#xem-lui')) sangXem(-1); else if (e.target.closest('#xem-toi')) sangXem(1); });

// ═══ 09/11/2026 đại ca: "ở phần duyệt này, có hiện phần bấm xem content bám win, bên trái là phân tích win của đối thủ và bên phải là mình viết bám win" ═══
function dongBW() { $('#nen-bw').classList.remove('mo'); }
const gioBW = t => t == null ? '' : Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0');
const soBW = n => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
async function moBW(p) {
  // 13/11/2026 đại ca: "bấm vào content bám win thì lại tự động phát video, sửa lại" — video thành phẩm / video gốc đang chạy phía sau thì dừng khi mở khung bám win
  const v0 = $('#vid'); if (v0) v0.pause();
  const g0 = $('#vid-goc'); if (g0) g0.pause();
  const th = $('#bw-than');
  th.style.padding = '';
  $('#nen-bw').classList.add('mo');
  $('#bw-tieu').textContent = 'Content bám win — ' + tenFile(p);
  th.innerHTML = '<div class="btrong">Đang đọc bài content + win đối thủ…</div>';
  let r;
  try { r = await (await fetch('/api/bam_win?p=' + encodeURIComponent(p))).json(); }
  catch (e) { th.innerHTML = '<div class="do">Không đọc được (server chưa nạp bản mới?): ' + esc(e) + '</div>'; return; }
  if (r.link_8778) $('#bw-8778').href = r.link_8778;
  if (!r.ok) {
    th.innerHTML = `<div class="bthe"><b class="vang">${esc(r.loi || 'không có dữ liệu')}</b>${r.file_content ? `<div class="chips"><span class="chip">${esc(r.file_content)}</span></div>` : ''}</div>`;
    return;
  }
  // 09/11/2026 đại ca: "tao muốn bấm vào content bám win là ra cả giao diện 8778 … xem được video win nói gì, rồi check xem content viết bám win nói gì"
  if (r.link_8778) {
    th.style.padding = '0';
    th.innerHTML = `<iframe src="${esc(r.link_8778)}" style="width:100%;height:100%;border:0;display:block;background:#0f1216" title="Tool content 8778"></iframe>`;
    return;
  }
  th.style.padding = '';
  const v = r.video, b = r.bai, t = r.tong || {}, w = r.win;
  const cua = typeof b.cua_may === 'string' ? b.cua_may : 'LỖI';
  let h = `<div class="tong">
    ${t.co_win ? `<div class="muc-${esc(t.muc)}">mức bám win<b>${esc(t.muc)}</b></div>
    <div>khối ghép được lát win<b>${t.khoi_ghep}/${t.khoi} · ${t.pct_khoi}%</b></div>
    <div>giữ câu mở (hook) của win<b class="${t.giu_hook ? 'xanh' : 'do'}">${t.giu_hook ? 'CÓ' : 'KHÔNG'} · giống ${Math.round((t.hook_giong || 0) * 100)}%</b></div>
    <div>lát win được dùng<b>${t.lat_giu + t.lat_cta}/${t.lat} · ${t.pct_lat}%</b></div>
    <div>độ giống câu TB<b>${Math.round((t.giong_tb || 0) * 100)}%</b></div>
    <div>số chữ mình / win<b>${t.chu_minh} / ${t.chu_win}</b></div>` : `<div class="muc-LỆCH">mức bám win<b>KHÔNG BÁM WIN</b></div>`}
    <div>cửa máy<b class="${cua === 'SẠCH' ? 'xanh' : 'do'}">${esc(cua)}</b></div>
    <div>kiểu bài<b style="font-size:13px">${esc(b.kieu || '')}</b></div></div>
  <div class="hai"><div class="bthe"><h4>Win đối thủ</h4>${w ? `
      <b>@${esc(w.doi_thu_id || w.doi_thu)}</b>${w.doi_thu ? ' · ' + esc(w.doi_thu) : ''} · <b>${soBW(w.view)}</b> view${w.view_7n ? ' (7 ngày ' + soBW(w.view_7n) + ')' : ''} · ${w.tim != null ? soBW(w.tim) + ' tim · ' : ''}${esc(w.ngay || '')}
      <div>${w.giay || '?'} s · ${w.so_cat ?? '?'} cắt · cảnh dài ${w.canh_dai ?? '?'}% · ${esc(w.dang || '')}</div>
      ${w.ly_do ? `<div class="btrong">${esc(w.ly_do)}</div>` : ''}
      ${w.link ? `<div><a href="${esc(w.link)}" target="_blank" style="color:#7fb4ff">▶ Mở video win trên TikTok</a></div>` : ''}
      <div class="chips">${(w.ty_trong || []).map(([y, n]) => `<span class="chip">${esc(y)} ×${n}</span>`).join('')}</div>`
      : `<span class="btrong">${esc(r.win_loi || ('Bài này không bám win — ' + (b.kieu || '') + (b.bo_qua ? ' · ' + b.bo_qua : '')))}</span>`}</div>
    <div class="bthe"><h4>Mình viết</h4><b>${esc(b.kenh || '')}</b> · ${esc(b.giong || '')} · ${esc(b.dang || '')}
      <div>${esc(v.dang)}${String(v.so).padStart(2, '0')}${b.img ? ' · clip ' + esc(b.img) : ''}${b.giay_clip ? ' · ' + b.giay_clip + ' s' : ''} · ${b.so_chu || t.chu_minh || '?'} chữ · ${esc(b.gia)}</div>
      <div class="chips"><span class="chip">${esc(b.trang_thai || '')}</span><span class="chip">${esc((b.ten_sp || '').slice(0, 90))}</span></div></div></div>`;
  if (w && (r.hang || []).length) {
    const pt = w.pt || [];
    const NHAN = {giu: 'GIỮ Ý', bo: 'MÌNH BỎ', them: 'MÌNH THÊM', cta: 'CTA'};
    h += `<div class="dau-cot"><div>◀ Win đối thủ nói gì (từng lát · phân tích)</div><div>Mình viết bám theo ▶</div></div>`;
    for (const x of r.hang) {
      const wi = x.win, a = wi && wi.i ? pt[wi.i - 1] : null;
      const trai = wi
        ? `<span class="nhan">${NHAN[x.kieu] || esc(x.kieu)}</span>${wi.tu != null ? `<span class="gio">${gioBW(wi.tu)}–${gioBW(wi.den)}</span>` : ''}${wi.i ? `<span class="m-ten">lát ${wi.i}${wi.den_i && wi.den_i !== wi.i ? '–' + wi.den_i : ''}</span>` : ''}
          <div class="w-loi">${esc(wi.loi)}</div>
          ${a ? `<div class="chips"><span class="chip">${esc(a.vai)}</span>${(a.y || []).map(y => `<span class="chip">${esc(y)}</span>`).join('')}${(a.ngoai || []).map(y => `<span class="chip ngoai" title="win nói nhưng trang sản phẩm không có — mình phải bỏ">⚠ ${esc(y)}</span>`).join('')}</div>` : ''}`
        : `<span class="nhan">${NHAN[x.kieu] || esc(x.kieu)}</span><div class="btrong">win không có lát tương ứng — mình viết thêm</div>`;
      const phai = x.minh.length
        ? x.minh.map(m => `<div class="m"><span class="m-ten">Khối ${m.i} · ${esc(m.ten || m.vai || '')}</span>${m.giong != null && x.kieu === 'giu' ? `<span class="pct ${m.giong >= .5 ? 'xanh' : m.giong >= .3 ? 'vang' : 'do'}">giống ${Math.round(m.giong * 100)}%</span>` : ''}<div class="m-loi">${esc(m.loi)}</div></div>`).join('')
        : `<div class="btrong">mình không dùng lát này</div>`;
      h += `<div class="bhang ${esc(x.kieu)}"><div>${trai}</div><div>${phai}</div></div>`;
    }
  } else {
    h += `<div class="dau-cot"><div></div><div>Mình viết ▶</div></div>` + (b.khoi || []).map((k, i) =>
      `<div class="bhang them"><div class="btrong">${i ? '' : 'không có win để so'}</div><div><span class="m-ten">Khối ${i + 1} · ${esc(k.ten || '')}</span><div class="m-loi">${esc(k.loi)}</div></div></div>`).join('');
  }
  th.innerHTML = h;
}

$('#chon-ngay').addEventListener('change', e => { NGAY = e.target.value; veDs(); });
document.addEventListener('change', e => { if (e.target.classList.contains('doi-ngay')) { NGAY = e.target.value; veDs(); } });   // ô chọn ngày trên khung đối chiếu
