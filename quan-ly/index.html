<script>
  (function () {
    const goc = location.protocol + '//' + location.hostname + ':8770';
    const hop = document.getElementById('dc-gop'), kh = document.getElementById('dcg-khung'), tab = document.getElementById('dcg-tab');
    const nho = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
    let nhom = nho('dcg-nhom') || 'dang', nap = false, song = 0;
    document.getElementById('dcg-rieng').href = goc + '/day-chuyen';
    let tram = null;                                             // {lo, ma, ten} — đang xem MỘT trạm (bấm quả cầu) thay vì một nhóm mục
    function ve() {
      tab.querySelectorAll('button').forEach(b => b.classList.toggle('on', !tram && b.dataset.n === nhom));
      const o = document.getElementById('dcg-tram');
      o.classList.toggle('on', !!tram);
      if (tram) o.innerHTML = '<b>🪐 Trạm: ' + tram.ten.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])) + '</b><span style="color:var(--mo)">lô ' + tram.lo +
        ' · ai / tool đang làm · model · tiến độ · nhật ký · Qwen gỡ mấy lần</span><span style="flex:1"></span><button id="dcg-ve">← xem cả dây chuyền</button>';
    }
    function dich() { return tram ? 'tram:' + tram.lo + ':' + tram.ma : nhom; }
    function mo() {
      if (hop.classList.contains('gap')) return;
      if (!nap) { nap = true; kh.src = goc + '/day-chuyen?nhung=1#' + encodeURIComponent(dich()); }
      else { try { kh.contentWindow.postMessage({dcChon: dich()}, '*'); } catch (e) {} }
    }
    tab.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      nhom = b.dataset.n; nho('dcg-nhom', nhom); tram = null; ve();
      if (hop.classList.contains('gap')) { hop.classList.remove('gap'); nho('dcg-gap', ''); document.getElementById('dcg-gap').textContent = '▾ thu gọn'; }
      mo();
    });
    document.getElementById('dcg-gap').addEventListener('click', e => {
      const g = hop.classList.toggle('gap'); nho('dcg-gap', g ? '1' : ''); e.target.textContent = g ? '▸ mở ra' : '▾ thu gọn'; mo();
    });
    addEventListener('message', ev => {                          // trang nhúng báo chiều cao ⇒ khung vừa khít nội dung; mục dài quá 1100 px thì cuộn trong khung
      if (!ev.data || !ev.data.dcNhung) return;                  //   (để tiến độ + phiếu sản phẩm bên dưới không bị đẩy xa)
      song = Date.now();
      document.getElementById('dcg-loi').style.display = 'none';
      kh.style.height = Math.max(160, Math.min(1100, ev.data.cao + 6)) + 'px';
    });
    setInterval(() => { if (nap && !hop.classList.contains('gap')) document.getElementById('dcg-loi').style.display = (Date.now() - song > 15000) ? 'block' : 'none'; }, 5000);
    // 19/11/2026 đại ca «sao ko tích hợp trạm vào đó được thế»: bấm một QUẢ CẦU TRẠM (hoặc ô trạm) ⇒ khối này hiện ngay thẻ chi tiết của ĐÚNG trạm đó
    //   (lấy từ trang dây chuyền); bấm lại quả cầu / nút «xem cả dây chuyền» ⇒ quay về nhóm mục đang xem.
    document.addEventListener('click', e => {
      if (e.target.closest('#dcg-ve')) { tram = null; ve(); mo(); return; }
      const n = e.target.closest('[data-tram]'); if (!n) return;
      const [lo, ma] = n.dataset.tram.split('|');
      setTimeout(() => {                                         // chờ trang chính đổi SV.tram (bấm lại cùng trạm = bỏ chọn)
        let chon = null; try { chon = SV.tram; } catch (x) {}
        tram = chon && chon.lo === lo && chon.ma === ma ? {lo, ma, ten: n.getAttribute('aria-label') || (n.querySelector('.ten, text') || {}).textContent || ma} : null;
        if (tram && hop.classList.contains('gap')) { hop.classList.remove('gap'); nho('dcg-gap', ''); document.getElementById('dcg-gap').textContent = '▾ thu gọn'; }
        ve(); mo();
      }, 60);
    });
    if (nho('dcg-gap')) { hop.classList.add('gap'); document.getElementById('dcg-gap').textContent = '▸ mở ra'; }
    ve(); song = Date.now(); mo();
  })();
  </script>

<script>
const $ = s => document.querySelector(s);
// ═══ 07/11/2026 đại ca: "code ở đây có phần bấm: Video chờ duyệt. Để tao vào duyệt và chỉnh sửa" ═══
const CD = {mo: false, so: null, d: null, kenh: '', loai: '', lo: '', luc: 0, chon: new Set(), dang: false};
async function napSoCD(ep) {
  if (!ep && CD.luc && Date.now() - CD.luc < 60000) return;
  CD.luc = Date.now();
  try {
    const d = await fetch('/api/cho_duyet').then(r => r.json()); const cu = CD.so;
    // 15/11/2026 đại ca: «tao ko F5 lại nên dữ liệu cũ — có cách nào nó tự cập nhật ko»: chỉ vẽ lại danh sách khi thật sự đổi (khỏi nhảy cuộn / tải lại video đang xem)
    const sig = JSON.stringify([d.cho.map(x => x.p), d.sua.map(x => x.p), d.xong]);
    const doi = sig !== CD.sig; CD.sig = sig; CD.d = d; CD.so = d.cho.length + d.sua.length;
    if (CD.mo && (doi || ep === 'vt')) { const cuon = $('#cd-than'); const y = cuon ? cuon.scrollTop : 0; veCD(); const m = $('#cd-than'); if (m) m.scrollTop = y; }
    if (cu !== CD.so && typeof veSVLai === 'function') veSVLai();
  } catch (e) {}
}
// tự nạp lại: mỗi 30 s khi tab đang mở + ngay khi quay lại tab (không cần F5); không nạp lúc đang xem video để khỏi ngắt
setInterval(() => { if (!document.hidden && !($('#nen-xem') && $('#nen-xem').classList.contains('mo'))) napSoCD(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) napSoCD(true); });
function moCD() { CD.mo = true; $('#nen-cd').classList.add('mo'); veCD(); napSoCD(true); }
function dongCD() { $('#nen-cd').classList.remove('mo'); CD.mo = false; }
function veCD() {
  const d = CD.d;
  const nutL = (k, v, ten) => `<button class="nut ${CD[k] === v ? 'chon' : ''}" data-cdloc="${k}|${v}">${ten}</button>`;
  $('#cd-dau').innerHTML = `<b style="font-size:16px">🎬 VIDEO CHỜ DUYỆT · mọi lô</b>
    <span style="color:var(--mo)">${d ? `${d.cho.length} chờ duyệt · ${d.sua.length} đang sửa lại` : 'đang tải…'}</span>
    <span class="loc" style="display:flex;gap:6px;flex-wrap:wrap">${nutL('lo', '', 'Mọi ngày')}${(d ? d.lo : []).map(l => nutL('lo', l, 'Lô ' + l)).join('')}
      <span style="width:8px"></span>${nutL('kenh', '', 'Mọi kênh')}${nutL('kenh', 'MAI ÁO ĐỎ', TEN_K['MAI ÁO ĐỎ'])}${nutL('kenh', 'MAI THI DAILY', TEN_K['MAI THI DAILY'])}
      <span style="width:8px"></span>${nutL('loai', '', 'Mọi loại')}${nutL('loai', 'ND', 'Video dựng ND')}${nutL('loai', 'OS', 'One short')}</span>
    <button class="nut" data-cdnhieu="1" id="cd-nhieu" style="margin-left:auto;background:#22c55e;color:#06121c;font-weight:800" title="Tích ô trên các video rồi bấm: đổi tên XONG cả loạt (như bấm ✅ ĐẠT từng video)">✅ DUYỆT NHIỀU FILE (${CD.chon.size})</button>
    <button class="nut" data-cddong="1">✕ Đóng</button>`;

  $('#chon-ngay').innerHTML = `<option value="">Tất cả ngày</option>` + nds.map(n => `<option value="${esc(n)}">Ngày ${esc(n)}</option>`).join('');
  $('#chon-ngay').value = ngay;
  const locNgay = q ? '' : ngay;                                             // đang gõ tìm thì tìm trong mọi ngày, tránh tưởng không có sản phẩm
  veTong(ngay, !!q);
  const loSV = NGAY ? NGAY : '';                                              // 17/11: mặc định server trả MỌI lô đang chạy + lô mới nhất (mới nhất đứng đầu)                                              // chọn hẳn một ngày ⇒ SỬA VIDEO hiện lô ngày đó; mặc định: lô đang chạy / mới nhất
  if (typeof SV !== 'undefined' && loSV !== (SV.lo || '')) {
    SV.lo = loSV;
    fetch('/api/tu_lam?ct=1&sau=999999999' + (loSV ? '&lo=' + encodeURIComponent(loSV) : '')).then(r => r.json()).then(d => { SV.d = Object.assign(SV.d || {}, {lo_tt: d.lo_tt}); veSVLai(); });
  }
  veDoi(ngay);
  veTienDo(ngay);
  const ds = DS.filter(x => {
    if (q && !`sp${x.stt} ${x.ten}`.toLowerCase().includes(q)) return false;
    if ((KENH || locNgay) && !coSp(x, KENH, locNgay)) return false;
    const [co, can] = phuSo(x);
    if (TT === 'thieu' && !(can && co < can)) return false;

    if (TT === 'video' && !videoLoc(x, KENH, locNgay).length) return false;

        <div class="ten">${esc(x.ten)}</div>

        <div class="chips">${x.ngay.map(n => `<span class="chip">${esc(n)}</span>`).join('')}
          ${nv('dung_xong') ? `<span class="chip xanh">▶ ${nv('dung_xong')} dựng xong</span>` : ''}
          ${nv('dai_ca_check') ? `<span class="chip" data-sp="${x.stt}" data-toi="nhom-dai_ca_check" title="Bản nháp lúc dựng (bản dựng gốc + bản tool sửa) — bấm để xem" style="cursor:pointer">${nv('dai_ca_check')} file nháp</span>` : ''}
          ${can && co < can ? `<span class="chip vang">thiếu ${can - co}</span>` : ''}</div></div></div>`;
  }).join('') || '<div class="rong">Không có sản phẩm khớp.</div>';
}

  }
  const [co, can] = phuSo(x);
  let h = `<div class="ct"><button class="nut chinh" data-quay="1" style="margin-bottom:14px;font-size:14px;padding:8px 16px">← Quay lại danh sách</button><div class="dau">${x.anh ? `<img src="${anh(x.anh)}" style="width:76px;border-radius:9px">` : ''}
    <div><h2>SP${x.stt} · ${esc(x.ten)}</h2><div class="phu">${x.kenh.map(kenhTag).join('')} · ngày ${x.ngay.map(esc).join(', ')} · ${x.so_canh} cảnh cắt · ${x.video.length} video</div></div></div>`;
  // 1. cảnh đã cắt — 29/10 đại ca (SP733 quay 23-10 + 24-10): "cảnh đã cắt cập nhật vào đây hết đi, bảng này phải phân loại và cập nhật hết cảnh đã cắt"
  // ⇒ MỘT bảng mỗi kênh: gộp mọi ngày vào đúng ô lượt · cảnh của phiếu (mỗi file ghi ngày), cảnh ngoài phiếu / không số lượt hiện ở cuối bảng
  const theoKenh = {};
  for (const p of x.phu) { const r = kq[p.thu_muc]; if (r) (theoKenh[p.kenh] ||= []).push({p, r}); }
  const nutF = (f, ng) => `<button class="f" data-p="${esc(f.path)}"><img loading="lazy" src="${anh(f.path)}" alt=""><div class="c">${esc(ng)} · máy ${esc(may(f.path))} · ${esc((f.img || '').replace('IMG_', '').replace(/^TK-([A-Z]{2})-\d+-P\d+-L(\d+)-C(\d+)(?:_\d{15,})?_/, 'L$2C$3 '))}</div></button>`;
  for (const [kn, ds] of Object.entries(theoKenh)) {
    ds.sort((a, b) => a.p.ngay.localeCompare(b.p.ngay));
    const goc = ds.find(d => (d.r.luoi || []).length) || ds[0];
    const luoi = (goc.r.luoi || []).map(l => ({luot: l.luot, ten: l.ten, canh: l.canh.map(c => ({canh: c.canh, tich: false, files: []}))}));
    const o = {}; luoi.forEach(l => l.canh.forEach(c => { o[`${l.luot}|${c.canh}`] = c; }));
    const ngoai = {}, khac = [];
    for (const {p, r} of ds) {
      (r.luoi || []).forEach(l => l.canh.forEach(c => {
        const d = o[`${l.luot}|${c.canh}`];
        if (d) { d.tich ||= c.tich; c.files.forEach(f => d.files.push({...f, ngay: p.ngay})); }
        else c.files.forEach(f => (ngoai[`${l.luot}|${c.canh}`] ||= []).push({...f, ngay: p.ngay}));
      }));
      (r.ngoai_phieu || []).forEach(n => n.files.forEach(f => (ngoai[`${n.luot}|${n.canh}`] ||= []).push({...f, ngay: p.ngay})));
      (r.khac || []).forEach(f => khac.push({...f, ngay: p.ngay}));

    luoi.forEach(l => l.canh.forEach(c => { can++; soFile += c.files.length; if (c.files.length) co++; else if (c.tich) tich++; else chua++; }));

        kNgoai.map(k => { const [l, c] = k.split('|'); return `<div class="canh"><div class="n"><b>L${l} C${c}</b><span>${esc(ngoai[k][0].co || '')}</span></div><div class="fs">${ngoai[k].map(f => nutF(f, f.ngay)).join('')}</div></div>`; }).join('') + '</div></div>';
    }
    if (khac.length) h += `<div class="luot"><div class="t"><b>Chưa số lượt</b><span style="color:var(--mo)">${khac.length} file</span></div><div class="vids">${khac.map(f =>
      `<button class="vid" data-p="${esc(f.path)}"><img loading="lazy" src="${anh(f.path)}" alt=""><div class="c">${esc(f.ngay)} · ${esc(f.ten)}</div></button>`).join('')}</div></div>`;
    h += '</div></div>';
  }
  if (x.canh_le.length) {
    h += `<div class="khoi"><div class="h"><b>Cảnh đã cắt (bố cục cũ)</b><span class="mo">${x.canh_le.length} file</span></div><div class="bd"><div class="vids">${x.canh_le.map(p =>
      `<button class="vid" data-p="${esc(p)}"><img loading="lazy" src="${anh(p)}" alt=""><div class="c">${esc(tenFile(p))}</div></button>`).join('')}</div></div></div>`;
  }
  // 2. video đã dựng
  for (const k of ['dung_xong', 'dai_ca_check', 'khac']) {
    const vs = x.video.filter(v => v.nhom === k); if (!vs.length) continue;
    h += `<div class="khoi" id="nhom-${k}"><div class="h"><b>${NHOM_V[k]}</b><span class="mo">${vs.length} video</span></div><div class="bd"><div class="vids">${vs.map(v =>
      `<button class="vid" data-p="${esc(v.path)}"><img loading="lazy" src="${anh(v.path)}" alt=""><div class="c">${esc(v.ten)}</div></button>`).join('')}</div></div></div>`;
  }
  // 3. thư mục
  h += `<div class="khoi"><div class="h"><b>Thư mục trên máy</b></div><div class="bd tmuc">${x.thu_muc.map(t =>
    `<button data-mo="${esc(t)}">📁 ${esc(t.replace(GOC + '\\', ''))}</button>`).join('')}</div></div></div>`;
  el.innerHTML = h;
  window.scrollTo(0, 0);
}

function veLai(tuLichSu) {

  $('#trang-sp').style.display = 'none'; $('#trang-ds').style.display = ''; $('#ve').style.display = 'none';
  if (!tuLichSu) history.replaceState(null, '', '#');
  window.scrollTo(0, CUON_DS);
}
addEventListener('popstate', () => {

    document.body.appendChild(o);
    o.querySelector('#bang-dung-ve').addEventListener('click', dongBangDung);

  o.querySelector('#bang-dung-ten').textContent = '🎬 Bảng dựng · ' + id;

function dongBangDung() {

}
